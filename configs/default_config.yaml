# =============================================================================
# Gait360 3D Tracking & Biomechanical Analysis Pipeline — Default Configuration
# =============================================================================

project:
  name: "gait360-3d-tracking"
  version: "1.0.0"
  default_articulation: "leg"

paths:
  data_dir: "data"
  dataset_dir: "data/Gait_Dataset"
  gt_cache_dir: "data/gt_cache"
  dataset_manifest: "data/dataset_manifest.json"
  videos_state: "data/videos_state.json"
  cutoff_freqs: "data/gt_cache/cutoff_freqs.json"
  candidate_cache: "data/candidate_videos_cache.json"
  benchmark_60_csv: "data/selected_inference_videos_60.csv"
  benchmark_40_csv: "data/selected_inference_videos_40.csv"
  raw_inference_dir: "data/inference_results/raw"
  refined_inference_dir: "data/inference_results/refined"
  results_dir: "results"
  models_dir: "models"
  deltav2_dir: "models/DELTAv2"

preprocessing:
  imu:
    min_samples: 200
    human_freq_range_hz: [0.5, 5.0]
    default_lowcut_hz: 0.5
    default_highcut_hz: 2.9296875
    butterworth_order: 4
    max_rom_deg: 180.0
    max_acc_ms2: 200.0
    max_angular_jump_deg: 30.0
  vision:
    default_triangle_size_px: 15
    huber_max_angle_deg: 20.0
    sobel_ksize: 3
    gaussian_blur_ksize: [7, 7]
    gradient_threshold: 15
    num_thigh_slices: 15
    thigh_width_factor: 0.40
    thigh_length_factor: 0.35
    safety_margin_px: 2.0
    knee_offset_factor: 0.10

tracking:
  backbone: "deltav2"
  deltav2:
    unidepth_model: "lpiccinelli/unidepth-v2-vitl14"
    unidepth_batch_size: 8
    window_len: 16
    coarse_to_fine_dense: true
    n_iters: 6
    num_thigh_queries: 200
    num_silhouette_queries: 800
    mediapipe_model_url: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/latest/pose_landmarker_full.task"
  dummy_baseline:
    focal_factor: 1.2
    default_depth_m: 2.5
    depth_mode: "constant"

postprocessing:
  geometric_pruning:
    cutoff_freq_hz: 2.9296875
    max_area_ratio: 5.0
    z_spike_penalty_weight: 2.5
    pca_components: 5
    dbscan_initial_eps: 0.5
    dbscan_eps_multiplier: 1.3
    dbscan_max_steps: 15
    min_3d_area_ratios: [0.05, 0.02, 0.01, 0.005, 0.001]

kinematic_alignment:
  world_projection:
    gravity_ms2: 9.80665
    g_unit_detection_bounds: [0.5, 2.0]
  triplet_extraction:
    twist_regularization_alpha_z: 0.05
    angular_despike_threshold_deg: 25.0
  temporal_sync:
    max_lag_seconds: 2.5
    use_sliding_window_normalization: true
  imu_calibration:
    use_anatomical_pca_basis: true
  filtering:
    butterworth_order: 4
    lowcut_hz: 0.5
    highcut_hz: 2.9296875

metrics:
  cadence:
    n_fft: 4096
    freq_band_hz: [0.4, 4.0]
    fft_swap_ratio_threshold: 1.6
  antiphase_swap:
    window_seconds: 1.2
    step_seconds: 0.2
    antiphase_r_threshold: -0.35
    duration_threshold_percent: 35.0
    crossover_angles: ["90", "45"]
    axial_angles: ["0", "180", "front", "rear", "posterior"]
