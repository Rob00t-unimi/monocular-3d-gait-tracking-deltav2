  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <!-- PrismJS per il Syntax Highlighting del codice -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css">
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-python.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-json.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-yaml.min.js"></script>
  
  <style>
    :root {
      --bg-main: #0d1117;
      --bg-sidebar: #161b22;
      --bg-card: #21262d;
      --border-color: #30363d;
      --text-main: #c9d1d9;
      --text-bright: #f0f6fc;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --accent-hover: #79c0ff;
      --accent-bg: rgba(56, 139, 253, 0.15);
      --code-bg: #1f242c;
      --table-stripe: #161b22;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: var(--font-sans);
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    aside {
      width: 340px;
      min-width: 340px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      z-index: 10;
    }

    .sidebar-header {
      padding: 18px 20px;
      border-bottom: 1px solid var(--border-color);
    }

    .sidebar-header h1 {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-bright);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sidebar-header p {
      font-size: 0.75rem;
      color: var(--text-muted);
      line-height: 1.3;
    }

    .search-box {
      margin: 12px 16px 8px 16px;
    }

    .search-box input {
      width: 100%;
      padding: 8px 12px;
      border-radius: 6px;
      background-color: var(--bg-main);
      border: 1px solid var(--border-color);
      color: var(--text-bright);
      font-size: 0.8rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: var(--accent);
    }

    .sidebar-menu {
      flex: 1;
      overflow-y: auto;
      padding: 8px 12px 24px 12px;
    }

    .category-group {
      margin-bottom: 16px;
    }

    .category-title {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      padding: 6px 10px;
      margin-bottom: 2px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 0.82rem;
      color: var(--text-main);
      text-decoration: none;
      cursor: pointer;
      margin-bottom: 2px;
      transition: background 0.15s, color 0.15s;
    }

    .nav-item:hover {
      background-color: rgba(177, 186, 196, 0.12);
      color: var(--text-bright);
    }

    .nav-item.active {
      background-color: var(--accent-bg);
      color: var(--accent);
      font-weight: 600;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background-color: var(--bg-main);
    }

    header {
      height: 56px;
      background-color: var(--bg-sidebar);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
    }

    .breadcrumb {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .breadcrumb strong {
      color: var(--text-bright);
      margin-left: 6px;
    }

    .lang-switcher {
      display: flex;
      background-color: var(--bg-main);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      overflow: hidden;
      padding: 2px;
    }

    .lang-btn {
      padding: 5px 14px;
      font-size: 0.78rem;
      font-weight: 600;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.2s;
    }

    .lang-btn.active {
      background-color: var(--accent);
      color: #0d1117;
    }

    .content-container {
      flex: 1;
      overflow-y: auto;
      padding: 36px 48px 80px 48px;
      line-height: 1.65;
    }

    .markdown-body {
      max-width: 980px;
      margin: 0 auto;
    }

    .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4 {
      color: var(--text-bright);
      margin-top: 24px;
      margin-bottom: 14px;
      font-weight: 600;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
    }

    .markdown-body h1 { font-size: 1.8rem; border-bottom: 2px solid var(--border-color); }
    .markdown-body h2 { font-size: 1.35rem; }
    .markdown-body h3 { font-size: 1.1rem; border-bottom: none; }

    .markdown-body p, .markdown-body ul, .markdown-body ol {
      margin-bottom: 16px;
      font-size: 0.92rem;
    }

    .markdown-body ul, .markdown-body ol {
      padding-left: 24px;
    }

    .markdown-body li {
      margin-bottom: 6px;
    }

    .markdown-body a {
      color: var(--accent);
      text-decoration: none;
    }

    .markdown-body a:hover {
      text-decoration: underline;
    }

    .markdown-body code {
      font-family: var(--font-mono);
      font-size: 0.85em;
      background-color: var(--code-bg);
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #ff7b72;
    }

    .markdown-body pre {
      background-color: #161b22;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 14px 18px;
      overflow-x: auto;
      margin-bottom: 20px;
      line-height: 1.45;
    }

    .markdown-body pre code {
      background: transparent;
      padding: 0;
      border: none;
      color: #e6edf3;
      font-size: 0.85rem;
      font-family: var(--font-mono);
      text-shadow: none;
    }

    .notebook-figure {
      background: #161b22;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      margin: 16px 0;
      text-align: center;
    }

    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 20px 0;
      font-size: 0.85rem;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      overflow: hidden;
    }

    .markdown-body th, .markdown-body td {
      padding: 10px 14px;
      border: 1px solid var(--border-color);
      text-align: left;
    }

    .markdown-body th {
      background-color: var(--bg-card);
      color: var(--text-bright);
      font-weight: 600;
    }

    .markdown-body tr:nth-child(even) {
      background-color: var(--table-stripe);
    }

    .markdown-body blockquote {
      border-left: 4px solid var(--accent);
      padding: 8px 16px;
      background-color: var(--accent-bg);
      margin-bottom: 16px;
      border-radius: 0 6px 6px 0;
      color: var(--text-main);
    }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
  </style>
</head>
<body>

    "en_path": "models/SpaTrackerV2/README.md",

  },

    "title_it": "VGGT (Meta / FAIR) — Readme Ufficiale",
    "title_en": "VGGT (Meta / FAIR) — Upstream README",
    "cat_it": "Modelli Esterni (Upstream)",
    "cat_en": "External Models (Upstream)",

    "it_path": "models/vggt/README.md"

];

    let currentDocId = 'readme';
    let currentLang = 'en';

    const UI_STRINGS = {
      it: {
        appTitle: '🔬 Docs Hub',
        appSubtitle: 'monocular-3d-gait-tracking-deltav2 Suite di Documentazione',
        searchPlaceholder: 'Cerca nella documentazione...',
        noResults: 'Nessun documento trovato'
      },
      en: {
        appTitle: '🔬 Docs Hub',
        appSubtitle: 'monocular-3d-gait-tracking-deltav2 Documentation Suite',
        searchPlaceholder: 'Search documentation...',
        noResults: 'No documents found'
      }
    };

    function updateUIStrings() {
      const strings = UI_STRINGS[currentLang];
      document.getElementById('uiAppTitle').textContent = strings.appTitle;
      document.getElementById('uiAppSubtitle').textContent = strings.appSubtitle;
      document.getElementById('searchInput').placeholder = strings.searchPlaceholder;
      document.documentElement.lang = currentLang;
    }

    function renderNav() {
      const navMenu = document.getElementById('navMenu');
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      navMenu.innerHTML = '';

      // Raggruppa per categoria nella lingua corrente
      const categories = {};
      docs.forEach(doc => {
        const cat = currentLang === 'it' ? doc.cat_it : doc.cat_en;
        if (!categories[cat]) {
          categories[cat] = [];
        }
        categories[cat].push(doc);
      });

      let totalFound = 0;

      Object.keys(categories).forEach(cat => {
        const filteredDocs = categories[cat].filter(d => {
          const title = currentLang === 'it' ? d.title_it : d.title_en;
          return title.toLowerCase().includes(searchTerm) || d.en_path.toLowerCase().includes(searchTerm);
        });

        if (filteredDocs.length > 0) {
          totalFound += filteredDocs.length;
          const group = document.createElement('div');
          group.className = 'category-group';

          const catTitle = document.createElement('div');
          catTitle.className = 'category-title';
          catTitle.textContent = cat;
          group.appendChild(catTitle);

          filteredDocs.forEach(doc => {
            const item = document.createElement('div');
            item.className = 'nav-item' + (doc.id === currentDocId ? ' active' : '');
            item.onclick = () => selectDoc(doc.id);

            const title = currentLang === 'it' ? doc.title_it : doc.title_en;
            item.innerHTML = `<span>${title}</span>`;
            group.appendChild(item);
          });

          navMenu.appendChild(group);
        }
      });

      if (totalFound === 0) {
        navMenu.innerHTML = `<div style="padding: 20px; text-align: center; color: var(--text-muted); font-size: 0.85rem;">${UI_STRINGS[currentLang].noResults}</div>`;
      }
    }

    function selectDoc(docId) {
      currentDocId = docId;
      renderNav();
      renderContent();
    }

    function setLanguage(lang) {
      currentLang = lang;
      document.getElementById('btnIT').className = 'lang-btn' + (lang === 'it' ? ' active' : '');
      document.getElementById('btnEN').className = 'lang-btn' + (lang === 'en' ? ' active' : '');
      updateUIStrings();
      renderNav();
      renderContent();
    }

    async function renderContent() {
      const doc = docs.find(d => d.id === currentDocId);
      if (!doc) return;

      const cat = currentLang === 'it' ? doc.cat_it : doc.cat_en;
      const title = currentLang === 'it' ? doc.title_it : doc.title_en;

      document.getElementById('docCategory').textContent = cat;
      document.getElementById('docTitle').textContent = title;

      const targetPath = (currentLang === 'it' && doc.it_path) ? doc.it_path : doc.en_path;
      const articleBody = document.getElementById('articleBody');

      // Stato di caricamento
      articleBody.innerHTML = `<div style="padding: 40px; text-align: center; color: var(--text-muted); font-size: 0.95rem;">Caricamento / Loading <code>${targetPath}</code>...</div>`;

      let rawContent = '';
      try {
        const response = await fetch(targetPath);
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: Impossibile recuperare ${targetPath}`);
        }
        rawContent = await response.text();
      } catch (err) {
        const isLocalFile = location.protocol === 'file:';
        articleBody.innerHTML = `
          <div style="background: rgba(248, 81, 73, 0.1); border: 1px solid rgba(248, 81, 73, 0.4); border-radius: 8px; padding: 24px; margin: 24px 0;">
            <h3 style="color: #f85149; margin-bottom: 10px; font-size: 1.1rem;">⚠️ Impossibile caricare direttamente il file Markdown</h3>
            <p style="color: var(--text-main); font-size: 0.9rem; margin-bottom: 12px;">Percorso richiesto: <code>${targetPath}</code></p>
            <p style="color: var(--text-muted); font-size: 0.85rem; line-height: 1.6;">
              ${isLocalFile 
                ? 'Stai aprendo <code>index.html</code> tramite il protocollo <code>file:///</code>. Le policy di sicurezza dei browser moderni (CORS) bloccano le chiamate <code>fetch()</code> locali verso file su disco.<br><br>👉 <strong>Per visualizzare la documentazione:</strong><br>1. Avvia un server locale rapido con: <code>python -m http.server 8000</code><br>2. Apri il browser all\'indirizzo: <a href="http://localhost:8000" style="color: var(--accent);">http://localhost:8000</a><br>3. Oppure visualizza il sito hostato su <strong>GitHub Pages</strong>.' 
                : 'Dettagli errore: ' + err.message}
            </p>
          </div>
        `;
        return;
      }

      // Rendering KaTeX formule matematiche prima di marked
      const mathDisplayRegex = /\$\$([\s\S]*?)\$\$/g;
      const mathInlineRegex = /\$([^\$\n]+?)\$/g;

      const mathPlaceholders = [];
      let processed = rawContent.replace(mathDisplayRegex, (match, expr) => {
        try {
          const rendered = katex.renderToString(expr.trim(), { displayMode: true, throwOnError: false });
          const key = '@@MATH_DISPLAY_' + mathPlaceholders.length + '@@';
          mathPlaceholders.push({ key: key, val: rendered });
          return key;
        } catch (e) {
          return match;
        }
      });

      processed = processed.replace(mathInlineRegex, (match, expr) => {
        try {
          const rendered = katex.renderToString(expr.trim(), { displayMode: false, throwOnError: false });
          const key = '@@MATH_INLINE_' + mathPlaceholders.length + '@@';
          mathPlaceholders.push({ key: key, val: rendered });
          return key;
        } catch (e) {
          return match;
        }
      });

      let html = marked.parse(processed);

      mathPlaceholders.forEach(item => {
        html = html.replace(item.key, item.val);
      });

      articleBody.innerHTML = html;
      if (window.Prism) {
        Prism.highlightAllUnder(articleBody);
      }
      document.querySelector('.content-container').scrollTop = 0;
    }

    document.getElementById('searchInput').addEventListener('input', renderNav);

    updateUIStrings();
    renderNav();
    renderContent();
  </script>
</body>
</html>
