[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "monocular-3d-gait-tracking-deltav2"
version = "1.0.0"
description = "360-Degree Monocular 3D Gait Analysis Pipeline via Dense 3D Point Tracking (DELTAv2) and Geometric Post-Processing"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Roberto Tallarini", email = "roberto.tallarini@studenti.unimi.it"}
]
keywords = ["gait-analysis", "3d-point-tracking", "deltav2", "biomechanics", "imu-validation", "computer-vision"]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "opencv-python>=4.8.0",
    "pyyaml>=6.0",
    "matplotlib>=3.7.0",
    "scikit-learn>=1.3.0",
    "tqdm>=4.65.0",
    "mediapipe>=0.10.14",
]

[project.scripts]
gait360 = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py310"
